name: Update jlcat

on:
  schedule:
    - cron: '32 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-jlcat
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.334.0
        with:
          bundler-cache: true
      - name: Test updater
        run: bundle exec ruby test/jlcat_formula_test.rb
      - name: Find latest stable release
        id: release
        run: |
          metadata="$RUNNER_TEMP/jlcat-release.json"
          gh api repos/nicecab/jlcat/releases/latest > "$metadata"
          tag=$(ruby -rjson -e 'tag=JSON.parse(File.read(ARGV[0])).fetch("tag_name"); abort "invalid stable release tag" unless /\Av\d+\.\d+\.\d+\z/.match?(tag); puts tag' "$metadata")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download release assets
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo nicecab/jlcat \
            --pattern '*.tar.gz' --pattern '*.tar.gz.sha256' --dir "$RUNNER_TEMP/jlcat-assets"
      - name: Verify assets and render formula
        id: formula
        run: |
          ruby scripts/render_jlcat_formula.rb "$RUNNER_TEMP/jlcat-release.json" \
            "$RUNNER_TEMP/jlcat-assets" Formula/jlcat.rb
          ruby -c Formula/jlcat.rb
          if [ -z "$(git status --porcelain -- Formula/jlcat.rb)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            brew style Formula/jlcat.rb
          fi
      - name: Install and test the candidate formula
        if: steps.formula.outputs.changed == 'true'
        run: |
          tap_dir="$(brew --repository)/Library/Taps/nicecab/homebrew-ci"
          mkdir -p "$tap_dir/Formula"
          if brew commands | grep -qx trust; then
            brew trust nicecab/ci
          fi
          cp Formula/jlcat.rb "$tap_dir/Formula/"
          brew readall --os=sequoia --arch=arm nicecab/ci
          brew readall --os=sequoia --arch=intel nicecab/ci
          brew readall --os=linux --arch=intel nicecab/ci
          brew install --formula nicecab/ci/jlcat
          brew test nicecab/ci/jlcat
      - name: Commit verified formula update
        if: steps.formula.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git add Formula/jlcat.rb
          if git diff --cached --quiet; then
            echo "Formula is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update jlcat to $RELEASE_TAG"
          git push origin HEAD:main
